services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI — view reminder emails sent during local dev
      - "1025:1025"   # SMTP

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/booking
      DB_USER: booking
      DB_PASSWORD: booking
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8081
      TZ: Africa/Johannesburg   # booking times are local wall-clock times
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: CapitecAdmin123!
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: on-failure

volumes:
  pgdata:
